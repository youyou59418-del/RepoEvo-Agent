[project]
name = "repoevo-agent"
version = "0.1.0"
description = "A long-running, safe, evaluable software maintenance agent"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "prometheus-client>=0.21,<1",
    "pydantic-settings>=2.14,<3",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.4,<2",
    "fastmcp>=2,<3",
    "langchain-mcp-adapters>=0.1,<1",
    "redis>=5,<7",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repoevo*", "mcp_servers*", "apps*"]
exclude = ["tests*", "fixtures*", "deploy*"]

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.4,<2",
    "pydantic-settings>=2.14,<3",
    "fastmcp>=2,<3",
    "langchain-mcp-adapters>=0.1,<1",
    "redis>=5,<7",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["benchmarks", "fixtures"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
