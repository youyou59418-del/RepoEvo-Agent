services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: repoevo
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}"
      POSTGRES_DB: repoevo
    volumes:
      - repoevo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repoevo -d repoevo"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7
    volumes:
      - repoevo-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ../.env
    environment:
      CHECKPOINT_DSN: "postgresql://repoevo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}@postgres:5432/repoevo"
      REDIS_URL: redis://redis:6379/0
      REPOEVO_DATA_ROOT: /data/runtime
      REPOEVO_ARTIFACT_ROOT: /data/artifacts
      REPOEVO_SANDBOX_URL: "${REPOEVO_SANDBOX_URL:-http://host.docker.internal:19090}"
      REPOEVO_CORS_ORIGINS: "${REPOEVO_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - repoevo-artifacts:/data
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ../.env
    environment:
      CHECKPOINT_DSN: "postgresql://repoevo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}@postgres:5432/repoevo"
      REDIS_URL: redis://redis:6379/0
      REPOEVO_DATA_ROOT: /data/runtime
      REPOEVO_ARTIFACT_ROOT: /data/artifacts
      REPOEVO_SANDBOX_URL: "${REPOEVO_SANDBOX_URL:-http://host.docker.internal:19090}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "scripts/worker_once.py", "--forever"]
    profiles: ["worker"]
    volumes:
      - repoevo-artifacts:/data
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-http://127.0.0.1:8080}"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
volumes:
  repoevo-postgres:
  repoevo-redis:
  repoevo-artifacts:
